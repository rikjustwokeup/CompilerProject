services:
  sandbox:
    build: ./sandbox
    image: compiler-sandbox
    entrypoint: ["true"]
    restart: "no"

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    depends_on:
      sandbox:
        condition: service_completed_successfully
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    environment:
      MONGO_URI: mongodb://mongodb:27017/compilerapp
      REDIS_HOST: redis
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  client:
    build: ./client
    ports:
      - "3000:3000"

  mongodb:
    image: mongo

  redis:
    image: redis:alpine